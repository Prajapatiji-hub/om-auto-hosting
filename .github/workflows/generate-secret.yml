
name: Generate Fernet Secret Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Secret Key
        run: |
          python -m pip install cryptography
          python -c "from cryptography.fernet import Fernet; open('key.txt','w').write(Fernet.generate_key().decode())"

      - name: Upload Secret Key
        uses: actions/upload-artifact@v4
        with:
          name: om-hosting-secret-key
          path: key.txt
          retention-days: 1
          
